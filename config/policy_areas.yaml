# Pautas/areas de politica publica (secao 14.1 do briefing de expansao
# SIET) e a competencia federativa real de cada uma - usada pelo "gate de
# competencia do cargo" (secao 14.5: "Nenhuma proposta devera ser incluida
# sem verificar a competencia do cargo analisado" - src/platforms/platform_builder.py).
#
# BASE LEGAL (real, nao estimada): a maior parte das areas de politica
# social listadas aqui e "competencia comum" dos tres niveis de governo,
# por forca do Art. 23 da Constituicao Federal de 1988 (saude, assistencia
# social, habitacao, saneamento basico, educacao, cultura, meio ambiente,
# combate a pobreza, entre outras). Isso e um achado REAL do desenho
# federativo brasileiro, nao uma escolha de conveniencia deste sistema -
# ver nota metodologica no fim deste arquivo.
#
# niveis_competencia: quais niveis de governo tem poder real de legislar
# e/ou executar sobre a pauta - "municipal" | "distrital" | "estadual" |
# "federal". DF acumula municipal+distrital (Art. 32 CF/88 - o DF nao pode
# ser dividido em municipios, a Camara Legislativa do DF legisla sobre
# materias tipicamente municipais E estaduais).
#
# orgaos_por_nivel: nome generico do orgao executor tipico em cada nivel -
# usado por platform_builder.py para sugerir "orgao responsavel" de forma
# coerente com o cargo analisado (um Vereador nao propoe um Ministerio
# como orgao responsavel).

