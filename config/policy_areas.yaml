# ---------------------------------------------------------------------
# NOTA METODOLOGICA (leia antes de usar isto para "bloquear" uma proposta)
#
# As 35 pautas acima cobrem majoritariamente politicas sociais/de bem-estar,
# area em que o desenho constitucional brasileiro (Art. 23, CF/88) atribui
# COMPETENCIA COMUM aos tres niveis de governo - por isso quase todas tem
# niveis_competencia = [municipal, distrital, estadual, federal]. Isto NAO
# e uma simplificacao de conveniencia deste sistema: e o desenho real da
# federacao brasileira para esta familia de temas (diferente, por exemplo,
# de politica monetaria ou relacoes exteriores, que sao competencia federal
# exclusiva e nao aparecem nesta lista).
#
# Na pratica, isso significa que o "gate de competencia" em
# platform_builder.py raramente vai BLOQUEAR uma combinacao cargo x pauta
# desta lista - o valor real do gate esta em (1) documentar a base legal
# de cada pauta de forma rastreavel, citavel, nao inventada, e (2) sugerir
# o ORGAO RESPONSAVEL certo para o nivel do cargo analisado (um Vereador
# nao propoe "Ministerio da Saude" como orgao responsavel por uma UBS de
# bairro). Cargos verdadeiramente incompativeis com uma pauta desta lista
# sao a excecao, nao a regra - e quando existem (ex.: "pesca" no Distrito
# Federal), estao marcados explicitamente no campo `orgaos_por_nivel`.
